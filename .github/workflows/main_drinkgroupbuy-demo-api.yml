# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - drinkgroupbuy-demo-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  # Nothing used to run before a push to main went live, so a change PostgreSQL rejected (mark-ready for pickup,
  # 2026-10-01) deployed with a green run. This job is the gate: deploy waits for it. It is separate from
  # `build` on purpose: `npm ci` here must not put node_modules into the artifact that gets deployed.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # A real PostgreSQL for `npm run test:db`; the unit tests use a fake database and cannot see SQL errors.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drink_group_buy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/drink_group_buy_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A few unit tests open the SQLite development database, which is not in Git (it is ignored), so a fresh
      # checkout has to create it first; without this, three LINE Pay request tests fail with "no such table".
      - name: Create the SQLite development database the unit tests open
        run: npm run db:init

      - name: Unit tests
        run: npm test

      - name: SQL safety check
        run: npm run check:sql-safety

      - name: Real-database tests (throwaway schema)
        run: npm run test:db

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8D6E5556FE374EF49593F93491E180A3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_56B0B48EC6B44B5FA30455D600229730 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A981B779F151439F8CE29DB97659E8D3 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'drinkgroupbuy-demo-api'
          slot-name: 'Production'
          package: .
          